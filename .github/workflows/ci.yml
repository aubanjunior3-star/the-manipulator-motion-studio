name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows : poste de développement principal (docs/adr/0004).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Dépendances
        run: |
          pnpm install --frozen-lockfile
          uv --directory services/api sync --locked

      - name: Schéma à jour, tests Python, typecheck, tests TypeScript
        run: pnpm test

  visual:
    # Rendu réel WebGL (Chromium + SwiftShader) comparé aux images de référence,
    # et export vidéo analysé avec ffprobe.
    # Linux uniquement : le rendu logiciel varie d'un système à l'autre.
    name: Tests visuels et export (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Dépendances et navigateur
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @manipulator/viewer exec playwright install --with-deps chromium
          # ffprobe / ffmpeg : analyse des vidéos exportées par les tests
          command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Tests visuels
        run: pnpm test:visual

      - name: Images de différence (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: tests/golden/_diff/
