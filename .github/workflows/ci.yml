name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows : poste de développement principal (docs/adr/0004).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Dépendances
        run: |
          pnpm install --frozen-lockfile
          uv --directory services/api sync --locked

      - name: Schéma à jour, tests Python, typecheck, tests TypeScript
        run: pnpm test
