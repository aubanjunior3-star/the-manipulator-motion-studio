<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manipulator — Visionneuse</title>
  </head>
  <body>
    <div id="app">
      <header class="bar">
        <div class="brand"><span class="mark" aria-hidden="true"></span>MANIPULATOR<span class="sub">Visionneuse</span></div>
        <label class="field">
          <span>Scène</span>
          <select id="scene-select"></select>
        </label>
        <label class="btn file-btn">
          Ouvrir un fichier…
          <input id="file-input" type="file" accept=".json,application/json" hidden />
        </label>
        <button class="btn primary" id="export-open" title="Exporter la scène en vidéo">Exporter…</button>
        <div class="spacer"></div>
        <label class="check" title="Baisse la résolution pendant la lecture si l'affichage passe sous 24 images/s">
          <input id="adaptive" type="checkbox" checked /> Résolution adaptative
        </label>
        <div class="stats mono" id="stats">— fps</div>
      </header>

      <main class="stage" id="stage">
        <canvas id="canvas"></canvas>
        <div class="overlay mono" id="overlay"></div>
      </main>

      <aside class="issues" id="issues" hidden>
        <div class="issues-title">Avertissements</div>
        <ul id="issues-list"></ul>
      </aside>

      <dialog id="export-dialog" class="dialog">
        <form method="dialog" id="export-form">
          <div class="dialog-title">Exporter en vidéo</div>
          <label class="field">
            <span>Format</span>
            <select id="export-format">
              <option value="mp4">MP4 · H.264 (universel)</option>
              <option value="webm">WebM · VP9 (web)</option>
            </select>
          </label>
          <label class="field">
            <span>Résolution</span>
            <select id="export-size"></select>
          </label>
          <div class="mono dim" id="export-info"></div>
          <div class="progress" id="export-progress" hidden><div class="progress-bar" id="export-bar"></div></div>
          <div class="mono" id="export-status"></div>
          <a class="btn" id="export-download" hidden>Télécharger</a>
          <div class="dialog-actions">
            <button type="button" class="btn" id="export-cancel">Fermer</button>
            <button type="button" class="btn primary" id="export-start">Lancer l'export</button>
          </div>
        </form>
      </dialog>

      <footer class="transport">
        <button class="btn icon" id="play" title="Lecture / pause (Espace)" aria-label="Lecture">▶</button>
        <button class="btn icon" id="step-back" title="Image précédente (←)" aria-label="Image précédente">‹</button>
        <button class="btn icon" id="step-fwd" title="Image suivante (→)" aria-label="Image suivante">›</button>
        <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Position" />
        <div class="time mono" id="time">00:00.00 / 00:00.00</div>
        <label class="check"><input id="loop" type="checkbox" checked /> Boucle</label>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
