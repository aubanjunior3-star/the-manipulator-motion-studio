[project]
name = "manipulator-api"
version = "0.0.1"
description = "Backend de The Manipulator Motion Studio (schéma MSD, IA, audio, export)."
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.4",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manipulator_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
